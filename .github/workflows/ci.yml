name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stylua
        run: |
          curl -L https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-x86_64.zip -o stylua.zip
          unzip stylua.zip
          sudo mv stylua /usr/local/bin/

      - name: Check formatting
        run: stylua --check lua/ init.lua tests/

      - name: Install Luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck

      - name: Lint
        run: luacheck init.lua lua/core lua/plugins lua/lsp lua/tools lua/utils lua/monprofil tests/autocmds_spec.lua tests/env_spec.lua tests/keymaps_spec.lua tests/minimal_init.lua tests/safe_spec.lua

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        neovim: [nightly, v0.11.4]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Install plenary
        shell: bash
        run: |
          mkdir -p ~/.local/share/nvim/site/pack/test/start
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim \
            ~/.local/share/nvim/site/pack/test/start/plenary.nvim

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          nvim --headless -u tests/minimal_init.lua \
            -c "PlenaryBustedDirectory tests/ {minimal_init = 'tests/minimal_init.lua'}"

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "PlenaryBustedDirectory tests/ {minimal_init = 'tests/minimal_init.lua'}" | Out-File -FilePath test_cmd.vim -Encoding ascii
          nvim --headless -u tests/minimal_init.lua -S test_cmd.vim
